name: CI

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

  sqlite-import:
    name: Import (sqlite, INMEMDB_WITH_SQLITE=ON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsqlite3-dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure CMake (mit SQLite-Import)
        run: cmake -S . -B build -DINMEMDB_WITH_SQLITE=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test (inkl. Import-Tests)
        run: ctest --test-dir build --output-on-failure -C Release

  docs:
    name: Docs (doxygen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure CMake (mit Doku)
        run: cmake -S . -B build -DINMEMDB_BUILD_DOCS=ON

      - name: Build API-Doku
        run: cmake --build build --target docs
