name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Zusaetzlich Windows + macOS testen (nur bei Bedarf, laengere Laufzeit)'
        type: boolean
        default: false

# Ressourcen sparen: veraltete Laeufe desselben Branches abbrechen (aktuellster gewinnt)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Default nur Ubuntu; Windows/macOS nur bei manuellem Lauf mit full-matrix
      matrix:
        os: ${{ (github.event_name == 'workflow_dispatch' && inputs.full-matrix) && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') || fromJSON('["ubuntu-latest"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set +e
          cmake --build build --config Release -j 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|Fehler" /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-300)"; done
          exit $code

      - name: Test
        run: |
          set +e
          ctest --test-dir build --output-on-failure -C Release 2>&1 | tee /tmp/ctest.log
          code=${PIPESTATUS[0]}
          grep -E "FAILED|Fehler|FAIL |Segmentation|error:" /tmp/ctest.log | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-300)"; done
          exit $code

  sqlite-import:
    name: Import (sqlite, INMEMDB_WITH_SQLITE=ON)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libsqlite3-dev
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Configure CMake (mit SQLite-Import)
        run: cmake -S . -B build -DINMEMDB_WITH_SQLITE=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          set +e
          cmake --build build -j 2>&1 | tee /tmp/build.log
          code=${PIPESTATUS[0]}
          grep -E "error:|Fehler" /tmp/build.log | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-300)"; done
          exit $code

      - name: Test (inkl. Import-Tests)
        run: |
          set +e
          ctest --test-dir build --output-on-failure -C Release 2>&1 | tee /tmp/ctest.log
          code=${PIPESTATUS[0]}
          grep -E "FAILED|Fehler|FAIL |Segmentation|error:" /tmp/ctest.log | head -40 | while IFS= read -r l; do echo "::error::$(echo "$l" | cut -c1-300)"; done
          exit $code

  qmake-qt:
    name: qmake/Qt-Einbindung (FA-23)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt5 qmake
        run: sudo apt-get update && sudo apt-get install -y qtbase5-dev qt5-qmake g++ make

      - name: Build Library per qmake (InMemDB.pro)
        run: qmake InMemDB.pro -o Makefile.lib && make -f Makefile.lib -j

      - name: Build Qt-Beispiel (Variante A, vorgebaute Lib)
        run: |
          mkdir -p build-qt-a && cd build-qt-a
          qmake ../examples/qt_hello/hello.pro "DEFINES-=INMEMDB_BUILD_SOURCES" && make -j && ./qt_hello

      - name: Build Qt-Beispiel (Variante B, Quellen direkt mitkompilieren)
        run: |
          mkdir -p build-qt-b && cd build-qt-b
          qmake ../examples/qt_hello/hello.pro && make -j && ./qt_hello

      - name: Build & Smoke-Run Qt-Modell-Adapter (qt_table, headless offscreen)
        run: |
          mkdir -p build-qt-table && cd build-qt-table
          qmake ../examples/qt_table/table.pro && make -j && QT_QPA_PLATFORM=offscreen ./qt_table

  docs:
    name: Docs (doxygen)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Configure CMake (mit Doku)
        run: cmake -S . -B build -DINMEMDB_BUILD_DOCS=ON

      - name: Build API-Doku
        run: cmake --build build --target docs
