<text x="380" y="362" font-size="10.5" fill="#718096" text-anchor="middle">Guards: rows &lt; minJoinPairs oder Join-Abdeckung &lt; minJoinCoverage =&gt; Paar wird uebersprungen; Selbst-Referenzen uebersprungen (FA-31 zustaendig).</text>
